<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/mark-navy.png" />
    <link rel="apple-touch-icon" href="/mark-navy.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Matches --color-ground so the phone chrome continues the page. -->
    <meta name="theme-color" content="#ffffff" />

    <title>Mutnani Group of Companies — Prefab, Roofing & Global Trade, Hyderabad</title>
    <meta
      name="description"
      content="Pre-engineered buildings, roofing profile manufacturing and global imports, under one group since 2009. Balaji Prefab Private Limited, Balaji Roofing Industries and Mutnani IMEX Infra Private Limited — Hyderabad and Mumbai."
    />
    <meta
      property="og:title"
      content="Mutnani Group of Companies — Prefab, Roofing & Global Trade"
    />
    <meta
      property="og:description"
      content="Three companies, one group: pre-engineered buildings, roofing profile manufacturing and global imports. Building since 2009."
    />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts for typography options -->
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700&family=Oswald:wght@500;600;700&family=Outfit:wght@600;700&family=Space+Grotesk:wght@600;700&family=Inter:wght@600;700;800&family=Roboto+Slab:wght@600;700;800&family=Bebas+Neue&family=Archivo+Black&display=swap"
      rel="stylesheet"
    />
    <!--
      Logo preloader. Styles and markup are inline so it paints before the JS
      bundle downloads; src/lib/preloader.ts decides when it clears. The
      script below arms it and carries a 3.5s failsafe, so a bundle that never
      loads cannot leave the page shut.
    -->
    <link rel="preload" as="image" href="/brand/logo-mark.webp" />
    <link rel="preload" as="image" href="/brand/logo-name.webp" />
    <script>
      document.documentElement.classList.add('pre', 'is-loading')
      setTimeout(function () {
        var p = document.getElementById('preloader')
        if (p && !p.classList.contains('is-open')) p.classList.add('is-opening', 'is-open')
        document.documentElement.classList.remove('is-loading')
      }, 4000)
    </script>
    <style>
      .preloader { display: none }
      html.pre .preloader {
        display: block; position: fixed; inset: 0; z-index: 300;
        background: #ffffff;
        transition: opacity .6s cubic-bezier(.33, 1, .68, 1);
      }
      .preloader.is-open { opacity: 0 }
      html.is-loading, html.is-loading body { overflow: hidden }
      .preloader.is-opening, .preloader.is-open { pointer-events: none }

      /* ── Title card ── */
      .pre-centre {
        position: absolute; inset: 0; display: grid; place-items: center;
        transition: opacity .45s cubic-bezier(.33, 1, .68, 1), scale .7s cubic-bezier(.55, 0, .45, 1), filter .45s ease;
      }
      /* Out: the logo keeps coming toward the viewer as it fades — the same
         direction as the way in, so the exit reads as one continuous zoom. */
      .preloader.is-opening .pre-centre { opacity: 0; scale: 1.18; filter: blur(4px) }
      /* In: the whole lockup zooms up from small, as one piece. */
      .pre-stack {
        display: grid; justify-items: center;
        opacity: 0; scale: .35; filter: blur(6px);
        animation: preZoom 1.6s cubic-bezier(.22, 1, .36, 1) .1s forwards;
      }

      .pre-mark { position: relative; display: grid }
      .pre-logo {
        grid-area: 1 / 1;
        width: clamp(96px, 10vw, 140px); height: auto;
      }
      /* One pass of light across the mark, masked to its own shape so the band
         never shows as a rectangle over the transparent corners. */
      .pre-sheen {
        grid-area: 1 / 1;
        -webkit-mask: url(/brand/logo-mark.webp) center / contain no-repeat;
        mask: url(/brand/logo-mark.webp) center / contain no-repeat;
        background: linear-gradient(105deg, transparent 38%, rgba(255, 255, 255, .8) 50%, transparent 62%);
        background-size: 260% 100%; background-position: 140% 0;
        animation: preSheen 1s cubic-bezier(.65, 0, .35, 1) 1.2s forwards;
      }

      /* The name and tagline, from the client's artwork rather than set in
         type, so the loader shows exactly the logo the header does. */
      .pre-name {
        margin-top: clamp(20px, 2.4vw, 28px);
        width: clamp(220px, 26vw, 340px); height: auto;
      }
      .pre-line { margin-top: 18px; width: clamp(120px, 12vw, 160px); height: 2px; overflow: visible }
      .pre-line path {
        stroke-dasharray: 1; stroke-dashoffset: 1;
        animation: preDraw 1s cubic-bezier(.65, 0, .35, 1) 1s forwards;
      }

      @keyframes preZoom { to { opacity: 1; scale: 1; filter: blur(0) } }
      @keyframes preSheen { to { background-position: -40% 0 } }
      @keyframes preDraw { to { stroke-dashoffset: 0 } }

      @media (prefers-reduced-motion: reduce) {
        .preloader { display: none !important }
        html.is-loading, html.is-loading body { overflow: auto }
      }
    </style>
  </head>
  <body>
    <div class="preloader" id="preloader" aria-hidden="true">
      <div class="pre-centre">
        <div class="pre-stack">
          <div class="pre-mark">
            <img class="pre-logo" src="/brand/logo-mark.webp" alt="" width="330" height="263" fetchpriority="high" />
            <span class="pre-sheen"></span>
          </div>
          <img class="pre-name" src="/brand/logo-name.webp" alt="Mutnani Group — from vision to reality" width="720" height="114" />
          <svg class="pre-line" viewBox="0 0 160 2" preserveAspectRatio="none" aria-hidden="true">
            <defs>
              <linearGradient id="pre-brand" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#0054a8" />
                <stop offset="1" stop-color="#84c000" />
              </linearGradient>
            </defs>
            <path pathLength="1" d="M0,1 L160,1" fill="none" stroke="url(#pre-brand)" stroke-width="2" stroke-linecap="round" />
          </svg>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
